<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">


    <div class="container m-0">
        <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <span style="margin-right: 20px"></span>


        <div class="collapse navbar-collapse " id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <a class="navbar-brand" th:href="@{/home}">Zheiri Serviços</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </ul>
        </div>
    </div>
</nav>




<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">

    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="sidebarMenuLabel">Painel de Controle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body">
        <ul class="nav flex-column">
            <li class="nav-item mb-3">
                <a class="navbar-brand" th:href="@{/home}">Inicio</a>
            </li>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" href="#">Servicos</a>
            </li>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" href="#">agendamentos</a>
            </li>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" th:href="@{/listaUsuarios}">Usuarios</a>
            </li>
            <hr>
            <p class="card-text">Ajuda e configuração</p>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" href="#">Quem somos</a>
            </li>
            <li class="nav-item">
                <a class="navbar-brand" th:href="@{/login}">sair</a>
            </li>
        </ul>
    </div>
</div>


<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Atualizar usuario</h1>
                    <p class="text-secondary mb-0">Altere os dados do cadastro selecionado.</p>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/atualizarUsuario}" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{matricula}">

                        <div class="mb-3">
                            <label for="editarNome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="editarNome" th:field="*{editarNome}" placeholder="Digite o nome completo" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('editarNome')}" th:errors="*{editarNome}">Erro no nome</div>
                        </div>

                        <div class="mb-3">
                            <label for="editarDataNascimento" class="form-label">Data de nascimento</label>
                            <input type="text" class="form-control" id="editarDataNascimento" th:field="*{editarDataNascimento}" placeholder="Digite a sua data de nascimento" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('editarDataNascimento')}" th:errors="*{editarDataNascimento}">Erro no e-mail</div>
                        </div>

                        <div class="mb-3">
                            <label for="editarEmail" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="editarEmail" th:field="*{editarEmail}" placeholder="Digite o e-mail" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('editarEmail')}" th:errors="*{editarEmail}">Erro no e-mail</div>
                        </div>

                        <div class="mb-3">
                            <label for="editarSenha" class="form-label">Nova Senha</label>
                            <input type="password" class="form-control" id="editarSenha" th:field="*{editarSenha}" placeholder="Digite a senha" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('editarSenha')}" th:errors="*{editarSenha}">Erro na senha</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/usuarioLista}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Atualizar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
