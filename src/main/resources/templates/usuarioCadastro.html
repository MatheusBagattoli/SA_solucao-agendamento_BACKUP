<!doctype html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">

    <div class="container m-0">
        <span style="margin-right: 20px"></span>

        <div class="collapse navbar-collapse " id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <a class="navbar-brand" th:href="@{/home}">AgendaHub</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Cadastrar-se</h1>
                    <p class="text-secondary mb-0">Preencha os dados para criar o seu cadastro.</p>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${erro}">
                        <span th:text="${erro}"></span>
                    </div>

                    <div class="alert alert-success" th:if="${mensagem}">
                        <span th:text="${mensagem}"></span>
                    </div>
                    <form th:action="@{/usuarioCadastro}" th:object="${usuario}" method="post">

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Informe o nome completo" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro no nome</div>
                        </div>

                        <div class="mb-3">
                            <label for="dataNascimento" class="form-label">Data nascimento</label>
                            <input type="date" class="form-control" id="dataNascimento" th:field="*{dataNascimento}" placeholder="DInforme sua data de nascimento." required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}">Erro no e-mail</div>
                        </div>

                        <div class="mb-3">
                            <label for="matricula" class="form-label">Matricula</label>
                            <input type="text" class="form-control" id="matricula" th:field="*{matricula}" placeholder="Informe o número da matricula." required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}">Erro na matricula</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Informe seu E-mail." required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro no e-mail</div>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" th:field="*{senha}" placeholder="Informe a senha desejada." required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">Erro na senha</div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmaSenha" class="form-label">Confirme a senha</label>
                            <input type="password" class="form-control" id="confirmaSenha" th:field="*{confirmaSenha}" placeholder="Confirme a senha desejada." required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmaSenha')}" th:errors="*{confirmaSenha}">Erro na confirmação de senha</div>
                        </div>


                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/login}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
