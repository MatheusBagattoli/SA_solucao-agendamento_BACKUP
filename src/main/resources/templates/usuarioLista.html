<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">


    <div class="container m-0">
        <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <span style="margin-right: 20px"></span>


        <div class="collapse navbar-collapse " id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <a class="navbar-brand" th:href="@{/home}">Zheiri Serviços</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </ul>
        </div>
    </div>
</nav>




<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">

    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="sidebarMenuLabel">Painel de Controle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body">
        <ul class="nav flex-column">
            <li class="nav-item mb-3">
                <a class="navbar-brand" th:href="@{/home}">Inicio</a>
            </li>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" href="#">Servicos</a>
            </li>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" href="#">agendamentos</a>
            </li>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" th:href="@{/listaUsuarios}">Usuarios</a>
            </li>
            <hr>
            <p class="card-text">Ajuda e configuração</p>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" href="#">Quem somos</a>
            </li>
            <li class="nav-item">
                <a class="navbar-brand" th:href="@{/login}">sair</a>
            </li>
        </ul>
    </div>
</div>


<main class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Usuarios</h1>
            <p class="text-secondary mb-0">Lista de usuarios cadastrados no sistema.</p>
        </div>


        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Data de nascimento</th>
                            <th scope="col">Matricula</th>
                            <th scope="col">Email</th>
                            <th scope="col" class="text-end">...</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td th:text="${usuario.nome}"></td>
                            <td th:text="${usuario.dataNascimento}"></td>
                            <td th:text="${usuario.matricula}"></td>
                            <td th:text="${usuario.email}"></td>

                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/atualizarUsuario/{matricula}(matricula=${usuario.matricula})}">Editar</a>
                                <button th:data-id="${usuario.id}" class="excluir btn btn-sm btn-outline-danger">Excluir</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</main>

<!-- Inclua o script do excluir_usuario.js -->
<script src="/excluir_usuario.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
