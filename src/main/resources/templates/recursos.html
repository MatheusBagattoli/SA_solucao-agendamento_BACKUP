<!doctype html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container m-0">
        <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <span style="margin-right: 20px"></span>
        <div class="collapse navbar-collapse " id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <a class="navbar-brand" th:href="@{/home}">Zheiri Serviços</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </ul>
        </div>
    </div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="sidebarMenuLabel">Painel de Controle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="nav flex-column">
            <li class="nav-item mb-3">
                <a class="navbar-brand" th:href="@{/home}">Inicio</a>
            </li>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" th:href="@{/listaUsuarios}">Usuarios</a>
            </li>
            <li class="nav-item mb-3">
                <a class="nav-link text-secondary" th:href="@{/recursoLista}">Espaço e agendamento</a>
            </li>
            <li class="nav-item">
                <a class="navbar-brand" th:href="@{/login}">sair</a>
            </li>
        </ul>
    </div>
</div>

<main class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Recursos</h1>
            <p class="text-secondary mb-0">Lista de Recursos cadastrados.</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th scope="col">Descrição/Nome</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Dias da semana</th>
                            <th scope="col">Data de inicio</th>
                            <th scope="col">Data de final</th>
                            <th scope="col">Horario de inicio</th>
                            <th scope="col">Horario do fim</th>
                            <th scope="col" class="text-end">...</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="recurso : ${recursos}">
                            <td th:text="${recurso.descricao}"></td>
                            <td th:text="${recurso.tipo}"></td>
                            <td th:text="${recurso.diaSemana}"></td>
                            <td th:text="${recurso.dataInicioAgendamento}"></td>
                            <td th:text="${recurso.dataFimAgendamento}"></td>
                            <td th:text="${recurso.horaInicioAgendamento}"></td>
                            <td th:text="${recurso.horaFimAgendamento}"></td>

                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/recursoAtualizar/{id}(id=${recurso.id})}">Editar</a>
                                <button th:data-id="${recurso.id}" class="excluir-recurso btn btn-sm btn-outline-danger">Excluir</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Inclua o script de exclusão de recurso -->
<script src="/excluir_recurso.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
